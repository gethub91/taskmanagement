
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Task Management System</h1>
        <p>Manage Your Daily Tasks Easily</p>
    </header>

    <main class="container">

        <section class="form-box">
            <h2>Add New Task</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task"
                    maxlength="100"
                    required
                >

                <select id="priority">
                    <option value="Low">Low Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="High">High Priority</option>
                </select>

                <button type="submit">Add Task</button>
            <button type="submit" id="submitBtn">Add Task</button>

<button type="button" id="cancelEditBtn" hidden>
    Cancel Edit
</button>
</form>

            <p id="message"></p>
        </section>

        <section class="statistics">
            <div class="card">
                <h2 id="totalTasks">0</h2>
                <p>Total Tasks</p>
            </div>

            <div class="card">
                <h2 id="pendingTasks">0</h2>
                <p>Pending Tasks</p>
            </div>

            <div class="card">
                <h2 id="completedTasks">0</h2>
                <p>Completed Tasks</p>
            </div>
        </section>

        <section class="task-box">
            <h2>My Tasks</h2>

            <div class="filters">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="pending">Pending</button>
                <button class="filter" data-filter="completed">Completed</button>
            </div>
            <select id="categoryFilter">
    <option value="all">All Categories</option>
    <option value="Personal">Personal</option>
    <option value="Work">Work</option>
    <option value="Study">Study</option>
    <option value="Other">Other</option>
</select>

            <ul id="taskList"></ul>
        </section>

    </main>

    <footer>
        <p>Web Development Internship Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
